services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collabsheet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collabsheet"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      DATABASE_DSN: "postgres://collab:collab@db:5432/collabsheet?sslmode=disable"
      STATIC_DIR: "/app/web/dist"
      WORKBOOK_ID: "default"
    ports:
      - "8080:8080"

volumes:
  pgdata:
